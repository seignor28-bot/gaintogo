<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GainTogo – Gagnez de l’argent avec des tâches simples</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bande"></div>
<main>
  <h1>GainTogo</h1>
  <p class="sous">Répondez à des sondages et testez des applications. Vous êtes payé en FCFA. Aucun dépôt d’argent n’est demandé, jamais.</p>
  <div class="carte">
    <div class="onglets">
      <button id="t-connexion" class="actif" type="button">Se connecter</button>
      <button id="t-inscription" type="button">Créer un compte</button>
    </div>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" minlength="6">
    <button id="envoyer" class="btn" type="button">Se connecter</button>
    <p id="msg" class="msg" role="status"></p>
    <button id="oubli" class="lien" type="button">Mot de passe oublié ?</button>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
