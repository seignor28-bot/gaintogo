<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GainTogo – Gagnez de l’argent avec des sondages</title>
<link rel="stylesheet" href="design.css">
</head>
<body>
<div class="bande"></div>
<header class="hero">
  <div class="hero-in">
    <div class="haut"><span class="marque">GainTogo</span></div>
    <h1>Gagnez de l’argent avec des sondages</h1>
    <p>Donnez votre avis, soyez payé en FCFA. Gratuit, sans dépôt d’argent.</p>
    <div class="etapes">
      <div class="etape"><b>1</b>Créez votre compte</div>
      <div class="etape"><b>2</b>Répondez aux sondages</div>
      <div class="etape"><b>3</b>Cumulez vos gains</div>
    </div>
  </div>
</header>
<main>
  <div class="carte">
    <div class="onglets">
      <button id="t-connexion" class="actif" type="button">Se connecter</button>
      <button id="t-inscription" type="button">Créer un compte</button>
    </div>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" minlength="6">
    <button id="envoyer" class="btn" type="button">Se connecter</button>
    <p id="msg" class="msg" role="status"></p>
    <button id="oubli" class="lien" type="button">Mot de passe oublié ?</button>
    <ul class="garanties">
      <li>Inscription 100 % gratuite</li>
      <li>Aucun dépôt d’argent demandé, jamais</li>
      <li>Sondages proposés par CPX Research</li>
    </ul>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
